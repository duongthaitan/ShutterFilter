<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShutterFilter by Tandev.foto</title>

    <script>
      try {
        if (localStorage.getItem('shutter_theme') === 'light') {
          document.documentElement.classList.add('theme-light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-amber-500/30 selection:text-inherit">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
